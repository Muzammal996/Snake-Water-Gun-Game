<!DOCTYPE html>
<html lang="en">
<>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Water Gun Pro</title>
    <link rel="stylesheet" href="style.css">
<body>
    <div class="container">
        <h1>🐍 Snake Water Gun 🔫</h1>
        <p class="rules">S = Snake | W = Water | G = Gun</p>

        <div class="score-board">
            <div class="score-card">
                <h3>YOU</h3>
                <span id="userScore">0</span>
            </div>
            <div class="score-card">
                <h3>CPU</h3>
                <span id="cpuScore">0</span>
            </div>
        </div>

        <div class="input-section">
            <input type="text" id="userInput" class="input-box" placeholder="Enter S, W or G" maxlength="1">
            <button class="play-btn" onclick="playGame()">PLAY ▶</button>
        </div>

        <div class="result-area">
            <p id="resultText">Enter your move</p>
            <p id="choiceText"></p>
        </div>

        <button class="reset-btn" onclick="resetGame()">🔄 Reset</button>
    </div>

    <script src = "script.js"></script>
</body>
</html>
